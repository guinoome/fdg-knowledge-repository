 if(raw?.format!=='FDG-CONSTRUCTION-LIFECYCLE'||raw.version!==1||!raw.project||!Array.isArray(raw.registers?.Procurement))throw Error('Use this tool’s JSON backup or a lifecycle workspace JSON export.');if(!text(raw.project.id)||!date(raw.project.asOf))throw Error('Lifecycle source needs project ID and report date.');const n=blank();n.project={id:text(raw.project.id),name:text(raw.project.name),asOf:raw.project.asOf,location:text(raw.project.location),preparedBy:text(raw.project.preparedBy)};
 const notes=['Draft material requirements only. Source orders/delivery/stock/progress/approvals are NOT imported. Each material retains its original source row.','This replaces the current workspace after confirmation; save current data first.'];
 for(const r of raw.registers.Procurement.filter(r=>!r._archived)){if(r.project_id!==raw.project.id||!text(r.id)||!text(r.description)||!text(r.unit)||r.required_qty!==null&&!nn(r.required_qty))throw Error('Source procurement row has invalid identity, unit or required quantity.');const materialId='SRC-'+r.id;if(n.materials.some(m=>m.id===materialId))throw Error('Duplicate procurement source ID.');n.materials.push({id:materialId,name:text(r.description),unit:text(r.unit),required:r.required_qty,neededBy:date(r.required_date)?r.required_date:null,revision:1,source:{format:raw.format,projectId:raw.project.id,register:'Procurement',sourceId:r.id,revision:r.revision??null,wbs:r.wbs_id||null,row:copy(r),importFile:name}});}
 if(!n.materials.length)throw Error('No active procurement demand rows in the lifecycle source.');return{candidate:normalize(n),notes,count:n.materials.length,source:name};}
 function csv(rows){const q=v=>{let s=v==null?'':String(v);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s;};return rows.map(row=>row.map(q).join(',')).join('\r\n');}
 return{num,nn,date,copy,active,types,blank,id,setup,material,order,move,voidRecord,summary,normalize,preview,csv,ledger};
}
const M=createMaterials();let state=M.normalize(JSON.parse(document.getElementById('project-data').textContent)),view='Home',dirty=false,undo=[],proposal=null,editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),fmt=n=>M.num(n)?n.toLocaleString(undefined,{maximumFractionDigits:3}):'Not recorded',money=n=>M.num(n)?'₱ '+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'Unknown';
function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function tell(s,bad=false){$('#notice').textContent=s;$('#notice').className=bad?'notice error':'notice';}
function change(action,next){undo.push(JSON.stringify(state));if(undo.length>15)undo.shift();state=next;dirty=true;render();tell(action+' Save project before closing.');}
function go(v){view=v;tell('');render();$('#content').focus({preventScroll:true});}
function download(text,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function save(){const d=document.documentElement.cloneNode(true);d.querySelector('#project-data').textContent=JSON.stringify(state).replaceAll('<','\\u003c');d.querySelectorAll('dialog').forEach(x=>x.removeAttribute('open'));download('<!doctype html>\n'+d.outerHTML,'FDG-Materials-'+(state.project.id||'Blank')+'.html','text/html;charset=utf-8');dirty=false;$('#save-state').textContent='Working copy prepared — keep the saved HTML';}
const field=(label,name,type='text',value='',extra='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>';
function metric(a,b,n){return '<article class="metric"><span>'+esc(a)+'</span><strong>'+esc(b)+'</strong><small>'+esc(n||'')+'</small></article>';}
function table(head,rows){return '<div class="table-scroll"><table><thead><tr>'+head.map(t=>'<th>'+esc(t)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
const td=t=>'<td>'+esc(t)+'</td>';
function render(){const p=state.project;$('#project-name').textContent=p.name||'Construction materials, made simple';$('#project-context').textContent=[p.location,p.asOf?'Report date '+p.asOf:''].filter(Boolean).join(' · ');$('#save-state').textContent=dirty?'Unsaved changes — save project before closing':'Offline working file · save manually';$('#undo').disabled=!undo.length;document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('selected',b.dataset.go===view));$('#view-title').textContent=({Home:'What do you need on site?',Materials:'Your material list',Orders:'Orders and deliveries',Stock:'What moved on site?',Report:'Your materials report',Settings:'Project details'})[view];if(!p.id||view==='Settings'){renderSetup();return;}const q=M.summary(state);if(view==='Home')renderHome(q);if(view==='Materials')renderMaterials(q);if(view==='Orders')renderOrders(q);if(view==='Stock')renderStock(q);if(view==='Report')renderReport(q);}
function renderSetup(){const p=state.project;$('#content').innerHTML='<section class="quick-welcome"><div class="eyebrow">RECORD ONCE · SEE WHAT IS MISSING</div><h2>Know what to buy.<br>Know what arrived.</h2><p>Add your materials once. Log orders and site movements to generate shortage lists, delivery balances and a stock report.</p></section><form id="setup" class="panel quick-form"><div class="field-grid">'+field('Project name','name','text',p.name,'required maxlength="6000" placeholder="e.g. Cebu office fit-out"')+field('Report date','asOf','date',p.asOf||today(),'required')+'</div><details class="optional"><summary>Add your name or location (optional)</summary><div class="field-grid">'+field('Location','location','text',p.location,'maxlength="6000"')+field('Your name','preparedBy','text',p.preparedBy,'maxlength="6000"')+'</div></details><p id="form-error" role="alert"></p><button class="primary">'+(p.id?'Save details':'Start project →')+'</button></form>';$('#setup').onsubmit=e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));f.id='PROJECT-'+Date.now().toString(36).toUpperCase();change('Project details saved.',M.setup(state,f));go('Materials');}catch(err){$('#form-error').textContent=err.message;}};}
function rowCards(q,limit){return q.rows.slice(0,limit||1000).map(r=>'<div class="quick-work"><div><b>'+esc(r.name)+'</b><small>'+esc(r.unit)+(r.neededBy?' · Needed '+esc(r.neededBy):'')+'</small><small>'+(r.required===null?'Requirement not entered':fmt(r.required)+' '+esc(r.unit)+' required')+' · '+fmt(r.onOrder)+' on order</small></div><div><strong>'+fmt(r.balance)+(r.balance===null?'':' '+esc(r.unit))+'</strong><small>recorded stock</small></div><div class="row-actions"><button data-move="'+esc(r.id)+'">Log movement</button><button data-order="'+esc(r.id)+'">Record order</button><button data-edit="'+esc(r.id)+'">Edit target</button></div>'+(r.stillToOrder>0?'<p class="quick-warning">'+fmt(r.stillToOrder)+' '+esc(r.unit)+' still to order</p>':'')+(r.source?'<details class="source"><summary>Imported demand source</summary><p>'+esc(r.source.register+' '+r.source.sourceId+' · project '+r.source.projectId+' · revision '+r.source.revision)+'</p><p>Snapshot only; no live sync.</p></details>':'')+'</div>').join('')||'<p class="empty">No materials yet. Add one to begin.</p>';}
function renderHome(q){$('#content').innerHTML='<section class="quick-welcome"><div class="eyebrow">MATERIALS → ORDERS → SITE RECORDS → REPORTS</div><h2>'+(q.rows.length?'Keep the site supplied.':'Start with one material.')+'</h2><p>We reuse the material name and unit in every order, movement and report.</p><div class="report-tools"><button class="primary" data-go="'+(q.rows.length?'Stock':'Materials')+'">'+(q.rows.length?'Log a delivery or site use':'Add first material')+' →</button><button data-go="Report">View report</button></div></section><div class="metrics quick-metrics">'+metric('Materials needing an order',q.rows.some(r=>r.required!==null)?q.shortageItems:'Not set',q.rows.some(r=>r.required===null)?q.rows.filter(r=>r.required===null).length+' requirements missing':'Based on known project requirements')+metric('Late order balances',q.overdue.length,'Outstanding after expected delivery date')+metric('Recorded order value',money(q.orderValue),q.unknownRates?q.unknownRates+' orders have no unit price':'Order record value, not cash paid')+'</div><div class="columns"><article class="panel"><h3>What needs attention</h3>'+attention(q)+'</article><article class="panel"><h3>Your material balances</h3>'+rowCards(q,3)+'</article></div>';}
function attention(q){const list=[...q.rows.filter(r=>r.stillToOrder>0).map(r=>({title:r.name,detail:fmt(r.stillToOrder)+' '+r.unit+' still to order',id:r.id})),...q.overdue.map(o=>({title:q.rows.find(r=>r.id===o.item).name,detail:fmt(o.outstanding)+' '+o.unit+' overdue from '+o.supplier+' · '+o.expected,id:o.item})),...q.rows.filter(r=>r.needCheck).map(r=>({title:r.name,detail:'Need-by date passed; required quantity not fully received',id:r.id}))];return list.map(a=>'<div class="attention-row"><div><b>'+esc(a.title)+'</b><p>'+esc(a.detail)+'</p></div><button data-order="'+esc(a.id)+'">Open</button></div>').join('')||'<p class="empty">No shortage or late order derived. Missing requirement/date inputs stay unknown.</p>';}
function renderMaterials(q){$('#content').innerHTML='<form id="material" class="panel quick-form"><h3>Add a material once</h3><div class="field-grid">'+field('Material name','name','text','','required maxlength="6000" placeholder="e.g. 25mm PVC pipe"')+'<label>Unit<select name="unit" required><option value="">Choose unit</option>'+['pcs','m','m²','m³','kg','tonnes','bags','litres','sets','lot'].map(x=>'<option>'+x+'</option>').join('')+'</select></label></div><details class="optional"><summary>Add project requirement or need-by date (optional)</summary><div class="field-grid">'+field('Total project requirement','required','number','','min="0" step="any" placeholder="Unknown until entered"')+field('Needed on site by','neededBy','date')+'</div></details><p id="form-error" role="alert"></p><button class="primary">Add material</button></form><article class="panel"><h3>Materials and recorded stock</h3>'+rowCards(q)+'</article>';$('#material').onsubmit=e=>{e.preventDefault();try{change('Material added.',M.material(state,Object.fromEntries(new FormData(e.target))));}catch(err){$('#form-error').textContent=err.message;}};}
function renderOrders(q){$('#content').innerHTML='<article class="panel"><h3>Record orders you placed</h3><p>Choose a material. Its name and unit are remembered. Recording an order does not send it or establish approval.</p><div class="report-tools"><button id="new-order" class="primary" '+(!q.rows.length?'disabled':'')+'>Record order</button><button data-go="Materials">Add material</button></div></article>'+table(['Material / supplier','Ordered','Net received','Outstanding','Expected','Record'],q.orders.map(o=>'<tr>'+td(q.rows.find(r=>r.id===o.item).name+' / '+o.supplier)+td(fmt(o.quantity)+' '+o.unit)+td(fmt(o.netReceived))+td(fmt(o.outstanding)+(o.overDelivered?' · over by '+fmt(o.overDelivered):''))+td(o.expected||'Not recorded')+'<td><button data-receive="'+esc(o.id)+'">Receive</button><button data-order-print="'+esc(o.id)+'">Print</button><button data-void="orders" data-id="'+esc(o.id)+'">Void</button></td></tr>'))+'<p class="small">Unlinked receipts affect recorded stock but do not close an order balance. Link the original order when receiving. Returned quantities reopen its balance for replacement.</p>';if($('#new-order'))$('#new-order').onclick=()=>openOrder();}
function choices(selected){return state.materials.map(m=>'<option value="'+esc(m.id)+'" '+(m.id===selected?'selected':'')+'>'+esc(m.name)+' ('+esc(m.unit)+')</option>').join('');}
function openOrder(item){if(!state.materials.length){go('Materials');return;}editing={kind:'order'};$('#dialog-title').textContent='Record an order';$('#dialog-fields').innerHTML='<div class="field-grid"><label>Material<select name="item" required>'+choices(item)+'</select></label>'+field('Quantity ordered','quantity','number','','min="0.0000001" step="any" required')+field('Supplier','supplier','text','','required maxlength="6000" placeholder="Supplier name"')+field('Expected delivery (optional)','expected','date')+'</div><details class="optional"><summary>Add price, order reference or note (optional)</summary><div class="field-grid">'+field('Order date','date','date',state.project.asOf,'required')+field('Unit price PHP','rate','number','','min="0" step="any"')+field('Actual order / PO reference','reference','text','','maxlength="6000"')+'<label>Note<textarea name="note" rows="2" maxlength="6000"></textarea></label></div></details><p class="small">This records a reported order. Print creates an order record, not a signed or issued PO.</p>';showDialog();}
function openMove(item,type='Received',order=null){if(!state.materials.length){go('Materials');return;}editing={kind:'move'};$('#dialog-title').textContent='Log a site movement';$('#dialog-fields').innerHTML='<div class="field-grid"><label>Material<select name="item" required>'+choices(item)+'</select></label><label>What happened?<select name="type">'+M.types.map(x=>'<option '+(x===type?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+field('Quantity added / removed','quantity','number','','min="0" step="any" required')+field('Date','date','date',state.project.asOf,'required')+'<label id="order-wrap">Link order (optional)<select name="order"></select></label></div><p id="balance-hint" class="quick-hint"></p><details class="optional"><summary>Add receipt reference, location or note (optional)</summary><div class="field-grid">'+field('Receipt / issue / count reference','reference','text','','maxlength="6000"')+field('Location / recipient','location','text','','maxlength="6000"')+'<label>Note<textarea name="note" rows="2" maxlength="6000"></textarea></label></div></details><p class="small">Record quantity only. Receipt/issue is not QA acceptance or installed progress. Opening count must come first; enter zero to confirm an empty opening ledger.</p>';showDialog();
 const update=()=>{const id=$('#entry-form [name=item]').value,t=$('#entry-form [name=type]').value,orders=M.active(state,'orders').filter(o=>o.item===id),r=M.summary(state).rows.find(r=>r.id===id);$('#entry-form [name=order]').innerHTML='<option value="">Not linked to an order</option>'+orders.map(o=>'<option value="'+esc(o.id)+'" '+(o.id===order?'selected':'')+'>'+esc(o.supplier+' · '+(o.reference||o.id))+'</option>').join('');$('#order-wrap').hidden=!['Received','Returned to supplier'].includes(t);if($('#order-wrap').hidden)$('#entry-form [name=order]').value='';$('#balance-hint').textContent=fmt(r.balance)+(r.balance===null?'':' '+r.unit)+' recorded stock · quantity uses '+r.unit;};$('#entry-form [name=item]').onchange=()=>{order=null;update();};$('#entry-form [name=type]').onchange=()=>{order=null;update();};update();}
function showDialog(){$('#entry-error').textContent='';$('#entry-dialog').showModal();}
$('#entry-form').onsubmit=e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));if(editing.kind==='order')change('Order recorded.',M.order(state,f));if(editing.kind==='move')change('Movement recorded; balances updated.',M.move(state,f));if(editing.kind==='edit')change('Working target revised.',M.material(state,f,editing.id));$('#entry-dialog').close();}catch(err){$('#entry-error').textContent=err.message;}};
$('#cancel-entry').onclick=()=>$('#entry-dialog').close();
function editMaterial(id){const m=state.materials.find(r=>r.id===id);editing={kind:'edit',id};$('#dialog-title').textContent='Edit working requirement';$('#dialog-fields').innerHTML='<div class="field-grid">'+field('Material name','name','text',m.name,'required maxlength="6000"')+field('Unit','unit','text',m.unit,'required maxlength="100"')+field('Total project requirement','required','number',m.required??'','min="0" step="any"')+field('Need-by date','neededBy','date',m.neededBy||'')+'</div><p class="small">Unit is protected after transactions. Original imported demand is retained separately; this edits only the working requirement.</p>';showDialog();}
function renderStock(q){const rows=M.active(state,'movements').filter(m=>m.date<=state.project.asOf).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('#content').innerHTML='<article class="panel"><h3>Delivery, site use or return?</h3><p>Enter each movement once. Recorded stock and order balances update together.</p><div class="report-tools"><button id="new-move" class="primary" '+(!q.rows.length?'disabled':'')+'>Log movement</button><button data-go="Materials">Add material</button></div></article>'+table(['Date / material','Movement','Quantity','Order / reference','Action'],rows.map(r=>'<tr>'+td(r.date+' / '+state.materials.find(m=>m.id===r.item).name)+td(r.type)+td(fmt(r.quantity)+' '+r.unit)+td((r.order||'Unlinked')+' / '+(r.reference||'Not recorded'))+'<td><button data-void="movements" data-id="'+esc(r.id)+'">Void / correct</button></td></tr>'))+'<details class="panel optional"><summary>Correction history ('+state.movements.filter(r=>r.voided).length+' voided movements)</summary>'+table(['Record','Movement / quantity','Correction reason'],state.movements.filter(r=>r.voided).map(r=>'<tr>'+td(r.id)+td(r.type+' '+fmt(r.quantity)+' '+r.unit)+td(r.voidReason)+'</tr>'))+'</details><p class="small">Recorded stock is the entered ledger balance, not a verified physical count. Reconcile opening stock and actual site counts. Issued quantity does not mean installed or accepted work.</p>';$('#new-move').onclick=()=>openMove();}
function reportHTML(q){const p=state.project;return '<article class="report-paper"><div class="report-brand">FDG CONSTRUCTION · PROCUREMENT & MATERIALS</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.location)+' · Report date '+esc(p.asOf)+'</p><p class="quick-draft">WORKING RECORD SUMMARY · NOT PURCHASE, QUALITY OR PAYMENT AUTHORITY</p><h3>What to order / receive</h3>'+table(['Material','Unit','Required','Still to order','Still to receive','On order','Recorded stock','Net issued'],q.rows.map(r=>'<tr>'+td(r.name)+td(r.unit)+td(fmt(r.required))+td(fmt(r.stillToOrder))+td(fmt(r.stillToReceive))+td(fmt(r.onOrder))+td(fmt(r.balance))+td(fmt(r.netIssued))+'</tr>'))+'<h3>Open order balances</h3>'+table(['Order / supplier','Material','Outstanding','Expected','Reported value'],q.orders.filter(o=>o.outstanding>0).map(o=>'<tr>'+td((o.reference||o.id)+' / '+o.supplier)+td(q.rows.find(r=>r.id===o.item).name)+td(fmt(o.outstanding)+' '+o.unit)+td(o.expected||'Not recorded')+td(money(o.value))+'</tr>'))+'<h3>Attention</h3>'+attention(q)+'<p>Recorded order value: '+money(q.orderValue)+(q.unknownRates?' · Known-price subtotal '+money(q.knownOrderSubtotal)+'; '+q.unknownRates+' rates missing.':'')+'</p><p>Prepared by '+esc(p.preparedBy||'not recorded')+'</p><p class="small">Each material retains its unit; quantities are never summed across different units. Required, ordered, delivered, issued, installed, QA accepted, billed and paid quantities are separate. This tool records the first four; it does not infer installed/accepted work, taxes, invoice authority or payment. Stock includes only entered movements at the cutoff. Draft demand imports retain their original references and are not live-synchronized.</p></article>';}
function renderReport(q){$('#content').innerHTML='<div class="report-tools"><button id="print-report" class="primary">Print / Save PDF</button><button id="csv-report">Export summary CSV</button></div>'+reportHTML(q);$('#print-report').onclick=()=>window.print();$('#csv-report').onclick=()=>download('\uFEFF'+M.csv([['material_id','name','unit','required','still_to_order','still_to_receive','on_order','recorded_stock','net_issued','source_id'],...q.rows.map(r=>[r.id,r.name,r.unit,r.required,r.stillToOrder,r.stillToReceive,r.onOrder,r.balance,r.netIssued,r.source?.sourceId||''])]),'FDG-Materials-summary.csv','text/csv;charset=utf-8');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.order){openOrder(b.dataset.order);return;}if(b.dataset.move){openMove(b.dataset.move);return;}if(b.dataset.edit){editMaterial(b.dataset.edit);return;}if(b.dataset.receive){const o=state.orders.find(o=>o.id===b.dataset.receive);openMove(o.item,'Received',o.id);return;}
 if(b.dataset.void){const reason=prompt('Why is this record being corrected? Original record will be retained.');if(!reason?.trim())return;try{change('Record voided with correction reason.',M.voidRecord(state,b.dataset.void,b.dataset.id,reason));}catch(err){tell(err.message,true);}return;}
 if(b.dataset.orderPrint){const o=state.orders.find(o=>o.id===b.dataset.orderPrint),m=state.materials.find(m=>m.id===o.item);$('#view-title').textContent='Order record';$('#content').innerHTML='<div class="report-tools"><button id="print-order" class="primary">Print record</button><button data-go="Orders">Back to orders</button></div><article class="report-paper"><div class="report-brand">FDG CONSTRUCTION · ORDER RECORD</div><h2>'+esc(state.project.name)+'</h2><p class="quick-draft">REPORTED ORDER · NOT AN ISSUED OR SIGNED PURCHASE ORDER</p><p>Supplier '+esc(o.supplier)+' · Reference '+esc(o.reference||o.id)+' · '+esc(o.date)+'</p>'+table(['Material','Quantity','Unit price','Record value'],['<tr>'+td(m.name)+td(fmt(o.quantity)+' '+m.unit)+td(money(o.rate))+td(money(o.rate===null?null:o.rate*o.quantity))+'</tr>'])+'<p>Expected delivery '+esc(o.expected||'not recorded')+'</p><p>'+esc(o.note)+'</p><p class="small">Use actual procurement authority and approved documents before commitment. No order was sent by this file.</p></article>';$('#print-order').onclick=()=>window.print();}});
$('#pm-save').onclick=save;$('#pm-backup').onclick=()=>download(JSON.stringify(state,null,2),'FDG-Materials-'+(state.project.id||'blank')+'.json','application/json');$('#pm-import').onclick=()=>$('#json-file').click();
$('#json-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15000000)throw Error('Backup exceeds15MB.');proposal=M.preview(state,JSON.parse(await f.text()),f.name);$('#import-preview').innerHTML='<p><b>'+proposal.count+' materials</b> from '+esc(f.name)+'</p><ul>'+proposal.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul><p>Current project is unchanged until you confirm.</p>';$('#import-dialog').showModal();}catch(err){tell(err.message,true);}finally{e.target.value='';}};
$('#commit-import').onclick=()=>{if(!proposal)return;const n=M.normalize(proposal.candidate);change('Import confirmed.',n);proposal=null;$('#import-dialog').close();go('Home');};$('#cancel-import').onclick=()=>{proposal=null;$('#import-dialog').close();};
$('#pm-example').onclick=()=>{if(!confirm('Replace current work with synthetic example? Save current work first.'))return;change('Synthetic example loaded — not real orders or receipts.',M.normalize(SAMPLE));go('Home');};$('#pm-new').onclick=()=>{if(!confirm('Start a blank project? Save current work first.'))return;change('Blank project started.',M.blank());go('Home');};
$('#undo').onclick=()=>{if(!undo.length)return;state=M.normalize(JSON.parse(undo.pop()));dirty=true;render();tell('Last session change undone. Save project to preserve it.');};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
