function renderGuide(){$('#content').innerHTML='<article class="panel help"><h2>Plan → update → control → issue</h2><ol><li>Complete Setup and the as-of date. Add activities with stable IDs, WBS, owner, baseline dates, forecast dates, budget and source.</li><li>Freeze an approved baseline reference in Baselines. Typed reviewer names are manual declarations. Preserve actual authorization in your document system.</li><li>Record Progress reviews. Reported and reviewed percentages are distinct. Only valid Reviewed snapshots at/before cutoff feed progress. Same-date duplicate reviews create a conflict; supersede the obsolete record.</li><li>Enter actual cost transactions with their source/date. Use Cost or Credit with a positive amount. Explicit sourced zero can record no cost as of the reporting date; no record remains unknown.</li><li>Record remaining commitment snapshots by contract and activity. The latest snapshot at/before cutoff is used; do not sum successive snapshots of the same contract. A zero releases a commitment.</li><li>Update each activity’s ETC, forecast date and source. ETC already includes open commitments and all remaining work. Forecast at completion=actual+ETC; adding commitments again would double count. ETC below recorded commitments is flagged and total forecast stays unavailable.</li><li>Resolve constraints and inspect the Gantt/look-ahead. Review Cost report, narrative and warnings; print and save an issued revision.</li><li>Save working HTML or export JSON before closing. Reopen saved HTML or import JSON to continue. No automatic browser storage, cloud sync or encryption is supplied.</li></ol><h3>Calculation basis</h3><p>Calendar-day finish variance=forecast/actual finish−baseline finish. Positive is late. Finish-to-start dependencies are comma-separated activity IDs; successor starts after predecessor finishes. Missing IDs, cycles and overlaps are warnings, not an automatic schedule solver. No CPM, float, work calendars, holidays or resource leveling is implemented.</p><p>Time-based planned progress uses an inclusive, uniform distribution across baseline calendar days, clamped0–100%. It is a disclosed planning assumption, not a resource-loaded or approved S-curve. Progress is weighted by activity budget, so it is not an independent physical quantity measure or earned-value certification. Unknowns remain n.a.; record an actual reviewed zero when known.</p><p>Budget headroom=budget−forecast total. Positive is under budget; negative is overrun. Cost values do not establish billed or paid amounts. Taxes, inflation and statutory treatment are not inferred. Forecast data/evidence must be supplied for the actual project.</p><p>Single editor. Archive/restore records; frozen baseline activities require a revision first. Last20 session undos; baseline freeze/revision boundaries clear the undo stack to preserve snapshots. Baseline snapshots and action history persist in exported copies, but the whole HTML/JSON remains editable. Keep client files private. Maximum1000 records/table; Gantt shows first100 activities. CSV exports active table inputs.</p></article>';}
const labels={id:'Stable record / activity ID',wbs:'WBS / cost code',name:'Activity name',owner:'Responsible owner',baselineStart:'Baseline start',baselineFinish:'Baseline finish',forecastStart:'Forecast start',forecastFinish:'Forecast finish',actualStart:'Actual start',actualFinish:'Actual finish',predecessors:'Finish-to-start predecessor IDs (comma-separated)',budget:'Approved budget PHP',etc:'ETC PHP — includes remaining commitments',forecastDate:'Cost forecast as-of date',forecastSource:'Cost forecast / ETC source',source:'Source / evidence reference',revision:'Revision',task:'Activity ID',date:'Record / snapshot date',reportedPct:'Reported progress (%)',reviewedPct:'Reviewed progress (%)',state:'Review state',status:'Work / constraint status',blocker:'Blocker / no-work reason',reviewer:'Actual reviewer',reviewDate:'Review date',type:'Cost entry type',amount:'Amount PHP (positive; type controls credit)',contract:'Contract / purchase order ID',remaining:'Remaining commitment PHP',due:'Action due date',description:'Constraint description',action:'Next action'};
function renderRegister(){const d=SCHEMA[view],q=$('#search').value.toLowerCase(),arch=$('#archived').checked,rows=state[view].filter(r=>(arch||!r.archived)&&Object.values(r).join(' ').toLowerCase().includes(q));$('#content').innerHTML='<p class="small">'+rows.length+' shown · '+C.active(state,view).length+' active. Select Edit for every field. '+(view==='tasks'&&state.locked?'Baseline dates and budget are locked until a revision is started.':'')+'</p>'+(rows.length?table([...d.shown.map(k=>labels[k]),'Actions'],rows.map(r=>'<tr class="'+(r.archived?'archived':'')+'">'+d.shown.map(k=>td(d.numeric.includes(k)?fmt(r[k]):r[k])).join('')+'<td class="row-actions"><button data-edit="'+esc(r.id)+'">Edit</button><button data-archive="'+esc(r.id)+'">'+(r.archived?'Restore':'Archive')+'</button></td></tr>')):'<article class="panel empty"><h3>No records</h3><p>Add a sourced project record to begin.</p></article>');
 $('#content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(b.dataset.edit));$('#content').querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{if(view==='tasks'&&state.locked){notice('Start a baseline revision before changing activity scope.',true);return;}const r=state[view].find(x=>x.id===b.dataset.archive);if(!r.archived&&!confirm('Archive '+r.id+'? Restore is available.'))return;mutate((r.archived?'Restore ':'Archive ')+view+' '+r.id,()=>r.archived=!r.archived);});}
function openRecord(id){if(!state.project.id){view='Setup';render();notice('Complete project setup first.',true);return;}if(view==='tasks'&&state.locked&&!id){notice('Start a baseline revision before adding activities.',true);return;}const d=SCHEMA[view],r=id?state[view].find(x=>x.id===id):{revision:1,state:'Draft',status:view==='constraints'?'Open':'Not Started',type:'Cost'};editing={table:view,id:id||null};$('#dialog-title').textContent=(id?'Edit ':'Add ')+d.title;$('#record-error').textContent='';
 $('#record-fields').innerHTML=d.fields.map(k=>{const v=r[k]??'';let control;const opts=k==='state'?['Draft','Reviewed','Superseded']:k==='status'?(view==='constraints'?['Open','In Progress','Resolved']:['Not Started','In Progress','Blocked','Complete']):k==='type'?['Cost','Credit']:null;
 if(opts)control='<select name="'+k+'">'+opts.map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
 else if(['source','forecastSource','description','action','blocker'].includes(k))control='<textarea name="'+k+'" rows="2">'+esc(v)+'</textarea>';
 else control='<input name="'+k+'" type="'+(d.dates.includes(k)?'date':d.numeric.includes(k)?'number':'text')+'" value="'+esc(v)+'" '+(d.numeric.includes(k)?'min="0" step="any" ':'')+(k==='id'?'required ':'')+((id&&k==='id')||(view==='tasks'&&state.locked&&['baselineStart','baselineFinish','budget'].includes(k))?'readonly ':'')+'>';
 return '<label>'+esc(labels[k])+control+'</label>';}).join('');$('#record-dialog').showModal();}
$('#record-form').onsubmit=e=>{e.preventDefault();try{const k=editing.table,d=SCHEMA[k],f=new FormData(e.target),r={};for(const key of d.fields){const v=String(f.get(key)||'').trim();r[key]=v===''?null:d.numeric.includes(key)?Number(v):v;}C.validate(state,k,r,editing.id);const ix=editing.id?state[k].findIndex(x=>x.id===editing.id):-1;if(ix<0&&state[k].length>=1000)throw Error('Maximum1000 records per table.');const old=ix>=0?state[k][ix]:null;r.archived=old?.archived||false;if(old)r.revision=Math.max(old.revision||0,r.revision||0)+1;mutate((old?'Revise ':'Create ')+k+' '+r.id+' '+JSON.stringify({before:old,after:r}),()=>{if(ix>=0)state[k][ix]=r;else state[k].push(r);});$('#record-dialog').close();editing=null;notice('Record updated. Save your working copy.');}catch(err){$('#record-error').textContent=err.message;}};
$('#cancel-record').onclick=()=>$('#record-dialog').close();$('#add').onclick=()=>openRecord();$('#search').oninput=renderRegister;$('#archived').onchange=renderRegister;
$('#baseline-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),revision=f.get('revision').trim(),source=f.get('source').trim(),reviewer=f.get('reviewer').trim();if(!revision||!source||!reviewer||state.baselines.some(b=>b.revision===revision)){$('#baseline-error').textContent='Unique revision, source and actual reviewer are required.';return;}mutate('Freeze baseline '+revision,()=>{state.baselines.push({revision,source,reviewer,at:new Date().toISOString(),items:C.active(state,'tasks').map(r=>({id:r.id,baselineStart:r.baselineStart,baselineFinish:r.baselineFinish,budget:r.budget}))});state.locked=true;});undo=[];$('#undo').disabled=true;$('#baseline-dialog').close();notice('Baseline snapshot retained; forecast updates remain editable.');};$('#cancel-baseline').onclick=()=>$('#baseline-dialog').close();
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$('#search').value='';$('#archived').checked=false;notice('');render();});
$('#save').onclick=save;$('#export').onclick=()=>download(JSON.stringify(state,null,2),(state.project.id||'Controls')+'-backup.json','application/json');$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15000000)throw Error('Backup exceeds15MB.');const next=C.normalize(JSON.parse(await f.text()));if(!confirm('Replace current workspace? Save current work first.'))return;mutate('Import project backup',()=>state=next);view='Overview';render();}catch(err){notice(err.message,true);}finally{e.target.value='';}};
$('#example').onclick=()=>{if(!confirm('Replace current work with synthetic example?'))return;mutate('Load synthetic example',()=>state=C.normalize(SAMPLE));view='Overview';render();notice('SYNTHETIC EXAMPLE — every source, cost and review is illustrative.');};$('#new').onclick=()=>{if(!confirm('Start blank project? Save current work first.'))return;mutate('Start blank project',()=>state=C.blank());view='Setup';render();};$('#undo').onclick=()=>{if(undo.length){state=C.normalize(JSON.parse(undo.pop()));dirty=true;render();}};
$('#csv').onclick=()=>{const d=SCHEMA[view],q=v=>{let s=v==null?'':String(v);if(typeof v==='string'&&/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const csv=d.fields.join(',')+'\r\n'+C.active(state,view).map(r=>d.fields.map(k=>q(r[k])).join(',')).join('\r\n');download('\uFEFF'+csv,(state.project.id||'Project')+'-'+view+'.csv','text/csv;charset=utf-8');};
