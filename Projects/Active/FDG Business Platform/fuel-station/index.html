<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FDG Fuel Station Operations local-first functional prototype" />
    <meta name="theme-color" content="#0b2018" />
    <title>FDG Fuel Station Operations</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./premium.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="brand-mark">/</span><strong>FDG</strong><span>BUSINESS<br />PLATFORM</span></div>
        <div class="site-chip"><span class="status-dot"></span><div><strong>NJ Gas Station</strong><small>Habay · Demo workspace</small></div></div>
        <nav aria-label="Primary navigation" id="primary-nav">
          <button class="nav-item" data-view="experience"><span class="nav-icon" data-icon="experience"></span>Client experience</button>
          <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="overview"></span>Station command</button>
          <button class="nav-item" data-view="closeout"><span class="nav-icon" data-icon="closeout"></span>Daily closeout</button>
          <button class="nav-item" data-view="tanks"><span class="nav-icon" data-icon="tanks"></span>Tanks &amp; wet stock</button>
          <button class="nav-item" data-view="deliveries"><span class="nav-icon" data-icon="deliveries"></span>Deliveries</button>
          <button class="nav-item" data-view="pricing"><span class="nav-icon" data-icon="pricing"></span>Pricing</button>
          <button class="nav-item" data-view="reports"><span class="nav-icon" data-icon="reports"></span>Reports</button>
          <button class="nav-item" data-view="audit"><span class="nav-icon" data-icon="audit"></span>Safety &amp; audit</button>
        </nav>
        <div class="sidebar-note"><span>LOCAL DEMO</span><p>Operational learning prototype. Not BIR, payment, or production ready.</p></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" aria-label="Toggle navigation"><span data-icon="menu"></span></button>
          <div class="search-wrap"><span>⌕</span><input id="global-search" type="search" placeholder="Search operations or reports" aria-label="Search" /></div>
          <div class="top-actions">
            <button class="client-view-button" id="client-view" type="button">Client view</button>
            <label class="role-picker">Role
              <select id="role-select">
                <option>Owner</option>
                <option>Station Manager</option>
                <option>Attendant</option>
              </select>
            </label>
            <span class="online-pill" id="storage-state"><span class="status-dot"></span> Saved locally</span>
          </div>
        </header>

        <section class="workspace" id="workspace" aria-live="polite"></section>
      </main>
    </div>

    <div class="offline-banner" id="offline-banner" role="status">Offline. Your local workflow remains available.</div>
    <nav class="mobile-dock" id="mobile-dock" aria-label="Mobile operations">
      <button data-view="overview"><span data-icon="overview"></span><small>Command</small></button>
      <button data-view="closeout"><span data-icon="closeout"></span><small>Closeout</small></button>
      <button data-view="tanks"><span data-icon="tanks"></span><small>Tanks</small></button>
      <button data-view="deliveries"><span data-icon="deliveries"></span><small>Delivery</small></button>
      <button data-view="audit"><span data-icon="audit"></span><small>Safety</small></button>
    </nav>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
