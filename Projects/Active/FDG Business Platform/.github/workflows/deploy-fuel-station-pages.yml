name: Deploy FDG Fuel Station to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "fuel-station/**"
      - ".github/workflows/deploy-fuel-station-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: fdg-fuel-station-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload fuel-station site
        uses: actions/upload-pages-artifact@v4
        with:
          path: fuel-station
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
