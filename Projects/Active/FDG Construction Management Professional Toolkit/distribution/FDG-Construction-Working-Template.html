 $('#content').innerHTML='<div class="intro"><div><span class="eyebrow">FIELD RECORDS → REVIEW → MANAGEMENT REPORT</span><h2>Keep progress connected to its evidence.</h2><p>Start with your approved work breakdown, record site events, then review quantities before issue.</p></div><button data-go="Setup">Project setup →</button></div><div class="metrics">'+sumCard('Accepted progress',pct(m.actual),'Reviewed quantities × approved weights')+sumCard('Planned progress',pct(m.plan),'Approved plan snapshot')+sumCard('Variance',m.variance===null?'n.a.':(m.variance*100).toFixed(1)+' pp','Actual minus planned')+sumCard('Overdue RFIs',m.overdue,'Due before the as-of date')+'</div><div class="columns"><article class="panel"><h3>Activity progress</h3>'+(!m.rows.length?'<p class="empty">No baseline yet. Set up the project and add WBS activities to begin.</p><button data-go="WBS">Add a baseline activity</button>':m.rows.map(r=>'<div class="activity"><div><b>'+esc(r.id)+' · '+esc(r.activity)+'</b><span>'+fmt(r.accepted)+' / '+fmt(r.baseline)+' '+esc(r.unit)+'</span></div><progress max="1" value="'+(r.fraction??0)+'"></progress><small>'+pct(r.fraction)+' accepted · weight '+pct(r.weight)+'</small></div>').join(''))+'</article><article class="panel"><h3>Control desk</h3><div class="control"><span>Open issues</span><b>'+m.openIssues+'</b></div><div class="control"><span>Open punch items</span><b>'+m.openPunch+'</b></div><div class="control"><span>Pending turnover</span><b>'+m.turnover+'</b></div><div class="control"><span>Baseline weight total</span><b>'+pct(m.weight)+'</b></div><p class="callout">'+(m.basis?'Baseline is complete. Verify actual evidence and approval authority.':'Progress unavailable until project/date, approved baseline, plan and weights totaling100% are complete.')+'</p><button data-go="Report">Prepare period report →</button></article></div><article class="panel"><h3>Data review queue</h3>'+(m.issues.length?'<ul>'+m.issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>No structural warnings. This does not authenticate evidence or approvals.</p>')+'</article>';
 }else if(view==='Setup'){renderSetup();}
 else if(view==='Report'){renderReport(m);}
 else if(view==='Audit'){$('#content').innerHTML='<p class="subtle">Changes in this file are recorded here. Preserve issued revisions in your approved document system. This editable history is not tamper-proof.</p>'+table(['Time','Action','Register','Record'],state.audit.slice().reverse().map(r=>'<tr>'+td(r.at)+td(r.action)+td(r.register)+td(r.id)+'</tr>'));}
 else if(view==='Help'){$('#content').innerHTML='<article class="panel help"><h2>Use this as your working construction template</h2><ol><li>Open Project setup and enter a stable project ID, dates and responsible people.</li><li>Add WBS activities with units, approved baseline, weights and planned fractions.</li><li>Add Daily events with reported quantities. Review separately and record accepted quantities, actual reviewer/date and evidence.</li><li>Use the other registers to control RFIs, submittals, constraints, QA/QC, changes, billing evidence, punch and turnover.</li><li>Set a week or month in Report. Review warnings, add a narrative and print the report.</li><li>Save a working HTML copy or JSON backup before closing. Open that HTML to resume offline. Browser refresh of an unsaved session loses edits.</li></ol><h3>Boundaries</h3><p>Reported ≠ accepted ≠ billable ≠ billed ≠ paid. Selected states and typed names do not authorize or certify work. Supply project-specific QA/QC criteria and contract rules. PHP fields do not compute statutory taxes or entitlement.</p><p>Blank values remain unknown. A reviewed zero must be entered explicitly. Different WBS units are never summed. Single-editor workflow; no cloud sync or permissions. Keep real project copies private. Maximum500 records per register; no file attachments are embedded, only evidence locators.</p><p>Use Export JSON for backups and Import JSON to reopen them. Import replaces the current workspace after confirmation. Load example replaces current work only after confirmation. Archive is reversible; archived records are excluded from calculations. Undo keeps the last20 session changes. CSV export includes active input records and neutralizes formula-prefixed text.</p></article>';}
 else renderRegister();
 $('#content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render();});
}
function renderSetup(){
 const p=state.project,fields=[['id','Project ID','text'],['name','Project name','text'],['location','Location','text'],['asOf','As-of date','date'],['start','Report start','date'],['end','Report end','date'],['preparedBy','Prepared by','text'],['reviewedBy','Actual reviewer','text'],['revision','Issue revision','number']];
 $('#content').innerHTML='<form id="setup-form" class="panel"><p class="subtle">One project per file. IDs remain stable once records exist. Blank dates leave progress unavailable.</p><div class="field-grid">'+fields.map(([k,l,t])=>'<label>'+l+'<input name="'+k+'" type="'+t+'" value="'+esc(p[k])+'" '+(k==='id'||k==='name'?'required':'')+(k==='revision'?' min="1" step="1"':'')+'></label>').join('')+'</div><button class="primary" type="submit">Save project setup</button></form>';
 $('#setup-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id').trim();if(id!==p.id&&Object.values(state.registers).some(a=>a.length)){notice('Keep the existing project ID, or start a separate blank project file.',true);return;}if(!id){notice('Enter a project ID.',true);return;}change('Update project setup',()=>fields.forEach(([k,l,t])=>state.project[k]=t==='number'?Number(f.get(k)):f.get(k).trim()));notice('Project setup updated. Save a working copy before closing.');};
}
function renderReport(m){
 const p=state.project;
 $('#content').innerHTML='<div class="report-tools"><button id="week">This week</button><button id="month">This month</button><button data-go="Setup">Change dates</button><button id="print-report" class="primary">Print report / Save PDF</button></div><article class="report-paper"><div class="report-brand">FDG · CONSTRUCTION MANAGEMENT · PHILIPPINES EDITION</div><h2>'+esc(p.name||'Untitled construction project')+'</h2><p>'+esc(p.id)+' · '+esc(p.location)+'</p><h3>Period progress report</h3><p>'+esc(p.start||'Start not set')+' → '+esc(p.end||'End not set')+' · As-of '+esc(p.asOf||'not set')+' · Revision '+esc(p.revision)+'</p><div class="metrics">'+sumCard('Accepted',pct(m.actual),'Cumulative')+sumCard('Planned',pct(m.plan),'At cutoff')+sumCard('Variance',m.variance===null?'n.a.':(m.variance*100).toFixed(1)+' pp','Percentage points')+'</div>'+(!m.interval?'<p class="callout">Set valid report dates and an as-of date. End must be on or after start.</p>':'')+table(['WBS / activity','Unit','Reported period','Accepted period','Accepted cumulative','Baseline','Accepted %'],m.rows.map(r=>'<tr>'+td(r.id+' '+r.activity)+td(r.unit)+td(fmt(r.reportedPeriod))+td(fmt(r.acceptedPeriod))+td(fmt(r.accepted))+td(fmt(r.baseline))+td(pct(r.fraction))+'</tr>'))+'<div class="field-grid"><label>Accomplishments, constraints and decisions<textarea id="narrative" rows="5">'+esc(p.narrative)+'</textarea></label><label>Next-period commitments / owner / due date<textarea id="nextActions" rows="5">'+esc(p.nextActions)+'</textarea></label></div><div id="printed-narrative"></div><p>Prepared by: '+esc(p.preparedBy||'Not recorded')+' · Actual reviewer: '+esc(p.reviewedBy||'Not recorded')+'</p><p class="small">Recorded quantities and manual review declarations. No professional certification, payment or contractual entitlement is implied. No events in the interval means no recorded events; it does not prove zero work.</p>'+(m.issues.length?'<p class="callout">Resolve before issue: '+esc(m.issues.join('; '))+'</p>':'')+'</article>';
 ['narrative','nextActions'].forEach(k=>$('#'+k).onchange=e=>{state.project[k]=e.target.value;dirty=true;$('#save-state').textContent='Unsaved report edits';});
 $('#print-report').onclick=()=>{state.project.narrative=$('#narrative').value;state.project.nextActions=$('#nextActions').value;$('#printed-narrative').innerHTML='<h4>Accomplishments / constraints / decisions</h4><p>'+esc(state.project.narrative).replaceAll('\n','<br>')+'</p><h4>Next-period commitments</h4><p>'+esc(state.project.nextActions).replaceAll('\n','<br>')+'</p>';window.print();};
 const period=kind=>{if(!E.date(p.asOf)){notice('Set an as-of date first.',true);return;}const d=new Date(p.asOf+'T00:00:00Z'),start=new Date(d);if(kind==='week')start.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));else start.setUTCDate(1);change('Set '+kind+' report period',()=>{p.start=start.toISOString().slice(0,10);p.end=p.asOf;});};
 $('#week').onclick=()=>period('week');$('#month').onclick=()=>period('month');
}
const shown={WBS:['wbs_id','activity','unit','baseline_qty','weight','planned_fraction'],Daily:['event_id','event_date','wbs_id','reported_qty','accepted_qty','review_state'],Kickoff:['item_id','item','owner','due_date','status'],RFI:['rfi_id','subject','wbs_id','due_date','status','next_action'],Submittals:['submittal_id','document_title','document_revision','due_date','status'],Issues:['issue_id','description','owner','due_date','status'],QAQC:['inspection_id','description','acceptance_criterion','observed_result','status'],Changes:['change_id','description','cost_impact_php','time_impact_days','status'],Billing:['billing_id','description','reported_qty','accepted_qty','billable_qty','billed_qty','paid_qty'],Punch:['punch_id','location','description','owner','status'],Turnover:['turnover_id','description','responsibility_receiver','status'],Evidence:['evidence_id','record_type','locator','verification_status'],History:['history_id','target_record_id','change_reason','actor','occurred_date']};
function renderRegister(){
 const d=E.defs[view],fields=shown[view],query=$('#search').value.toLowerCase(),archived=$('#show-archived').checked;
 const rows=state.registers[view].filter(r=>(archived||!r._archived)&&(!query||Object.values(r).join(' ').toLowerCase().includes(query)));
 $('#content').innerHTML='<p class="subtle">'+rows.length+' shown · '+E.active(state,view).length+' active · Select Edit to view every field. '+(view==='Daily'?'Accepted progress requires valid review evidence.':'Keep IDs, source references and revisions traceable.')+'</p>'+(!rows.length?'<article class="panel empty"><h3>No '+(query?'matching ':'')+'records</h3><p>Add your first '+esc(view)+' record to begin.</p></article>':table([...fields.map(label),'Actions'],rows.map(r=>'<tr class="'+(r._archived?'archived':'')+'">'+fields.map(f=>td(/weight|fraction/.test(f)?pct(r[f]):r[f])).join('')+'<td class="row-actions"><button data-edit="'+esc(r[E.idKey(view)])+'">Edit</button><button data-archive="'+esc(r[E.idKey(view)])+'">'+(r._archived?'Restore':'Archive')+'</button></td></tr>')));
 $('#content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(b.dataset.edit));
 $('#content').querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const r=state.registers[view].find(x=>x[E.idKey(view)]===b.dataset.archive);if(!r._archived&&!confirm('Archive '+b.dataset.archive+'? It will be excluded from active calculations. You can restore it.'))return;editing={id:b.dataset.archive};change(r._archived?'Restore record':'Archive record',()=>r._archived=!r._archived);editing=null;});
}
function openRecord(id){
 if(!state.project.id){notice('Complete Project setup before adding records.',true);view='Setup';render();return;}
 const d=E.defs[view],r=id?state.registers[view].find(x=>x[E.idKey(view)]===id):{},fields=d.fields.filter(k=>!(d.computed||[]).includes(k));editing={register:view,id:id||null};
 $('#dialog-title').textContent=(id?'Edit ':'Add ')+view+' record';$('#record-error').textContent='';
 $('#record-fields').innerHTML=fields.map(k=>{
 const numeric=/qty|weight|fraction|php|days/.test(k)||k==='revision'||k==='prior_revision'||k==='new_revision',value=k==='project_id'?state.project.id:r[k]??(k==='revision'?1:''),percent=/weight|fraction/.test(k),v=percent&&E.num(value)?value*100:value;
 let control;
 if(/status$|review_state/.test(k)){const opts=k==='verification_status'?['Unverified','Verified','Missing','Conflict - Review Required','Illustrative - not real evidence']:['Issues','Punch'].includes(view)?['Open','In Progress','Ready for Verification','Closed','Conflict - Review Required']:view==='Turnover'?['Pending','Submitted','In Review','Accepted','Conflict - Review Required']:status;control='<select name="'+k+'"><option value="">Not recorded</option>'+opts.map(x=>'<option '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';}
 else if(/description|criterion|observed_result|change_reason|impact_basis|next_action/.test(k))control='<textarea name="'+k+'" rows="2" maxlength="6000">'+esc(v)+'</textarea>';
 else control='<input name="'+k+'" value="'+esc(v)+'" type="'+(/date$/.test(k)?'date':numeric?'number':'text')+'" '+(numeric?'step="any" ':'')+(k===E.idKey(view)||k==='project_id'?'required ':'')+(k==='project_id'||(id&&k===E.idKey(view))?'readonly ':'')+'maxlength="6000">';
 return '<label>'+esc(label(k))+(percent?' (%)':'')+control+'</label>';
 }).join('');$('#record-dialog').showModal();
}
$('#record-form').onsubmit=e=>{
 e.preventDefault();const k=editing.register,d=E.defs[k],fd=new FormData(e.target),r={};try{
 for(const f of d.fields.filter(x=>!(d.computed||[]).includes(x))){const v=String(fd.get(f)||'').trim(),numeric=/qty|weight|fraction|php|days/.test(f)||f==='revision'||f==='prior_revision'||f==='new_revision';r[f]=v===''?null:numeric?Number(v)/(/weight|fraction/.test(f)?100:1):v;}
 r.project_id=state.project.id;E.validateRecord(state,k,r,editing.id);
 const ix=editing.id?state.registers[k].findIndex(x=>x[E.idKey(k)]===editing.id):-1;
 if(ix<0&&state.registers[k].length>=500)throw Error('Maximum500 records per register. Archive/export and open a separate controlled file.');
 const prior=ix>=0?state.registers[k][ix]:null;r._archived=prior?._archived||false;
 if(prior&&'revision'in r)r.revision=Math.max(Number(prior.revision)||0,Number(r.revision)||0)+1;
 change(prior?'Revise record':'Create record',()=>{if(ix>=0)state.registers[k][ix]=r;else state.registers[k].push(r);});$('#record-dialog').close();editing=null;notice('Record updated. Save your working copy.');
 }catch(err){$('#record-error').textContent=err.message;}
};
$('#cancel-record').onclick=()=>{$('#record-dialog').close();editing=null;};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;notice('');render();});
$('#add-record').onclick=()=>openRecord();$('#search').oninput=renderRegister;$('#show-archived').onchange=renderRegister;
$('#export-csv').onclick=()=>download('\uFEFF'+E.csv(state,view),(state.project.id||'Project')+'-'+view+'.csv','text/csv;charset=utf-8');
$('#save-html').onclick=saveHtml;$('#export-json').onclick=()=>{download(snapshot(),(state.project.id||'Project')+'-backup.json','application/json');notice('JSON backup prepared. Keep the downloaded file before closing.');};
$('#import-json').onclick=()=>$('#json-file').click();$('#json-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15000000)throw Error('Backup exceeds15MB limit.');const next=E.normalize(JSON.parse(await f.text()));if(!confirm('Replace the current workspace with this backup? Save current work first.'))return;change('Import project backup',()=>state=next);view='Dashboard';render();notice('Backup loaded. Check the project, dates and review queue.');}catch(err){notice(err.message,true);}finally{e.target.value='';}};
$('#load-sample').onclick=()=>{if(!confirm('Load the synthetic example? Current unsaved work will be replaced.'))return;change('Load synthetic example',()=>state=E.normalize(SAMPLE));view='Dashboard';render();notice('SYNTHETIC EXAMPLE: every record and approval is illustrative.');};
$('#new-project').onclick=()=>{if(!confirm('Start a blank project? Save current work first.'))return;change('Start blank project',()=>state=E.blank());view='Setup';render();};
$('#undo').onclick=()=>{if(!undo.length)return;state=E.normalize(JSON.parse(undo.pop()));state.audit.push({at:new Date().toISOString(),action:'Undo session change',register:view,id:'',detail:'Restored prior session state'});dirty=true;render();notice('Previous session state restored.');};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
render();</script></body></html>
