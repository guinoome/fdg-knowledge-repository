function createEstimator(){
 const fields=['id','boq','wbs','description','method','unit','length','width','depth','count','repetitions','manual','waste','costBasis','material','labor','equipment','subcontract','rateDate','source','owner','reviewer','status','revision','note'];

 }

 base=direct+p.indirect;contingency=base*p.contingency/100;overhead=(base+contingency)*p.overhead/100;const loaded=base+contingency+overhead;total=p.profitMode==='margin'?loaded/(1-p.profit/100):loaded*(1+p.profit/100);profit=total-loaded;}

 else $('#content').innerHTML='<article class="panel help"><h2>Measure → build rates → review → issue</h2><ol><li>Complete Project setup. Enter your own indirect costs, contingency, overhead and profit assumptions; blanks remain unknown.</li><li>Add a takeoff item. For geometry, enter dimensions in metres; use m, m2 or m3 as required. Repetitions multiply the measured quantity. Count uses nr; manual supports an explicit project unit.</li><li>Enter waste/allowance as a percentage of net quantity. Choose whether the cost basis uses net or net plus allowance. It is applied once.</li><li>Enter material, labor, equipment and subcontract PHP per unit. Use an explicit zero when a component has no cost. An empty component means unknown; total rate remains unavailable.</li><li>Map each item to BOQ and WBS, then retain drawing/measurement/rate source, rate date, owner and actual review. Split a BOQ code when units differ.</li><li>Review BOQ and Summary, record assumptions/exclusions and print. Save a working HTML or JSON backup before closing.</li></ol><h3>Pricing basis</h3><p>Direct=sum of line cost quantities×unit rate. Indirect is a fixed PHP amount. Contingency% applies to direct+indirect. Overhead% applies after contingency. Markup% applies to that loaded cost. A target margin instead calculates selling price=loaded cost/(1−margin). No taxes, statutory deductions, contractual billing or payment are inferred. Values are rounded for display only.</p><p>This is an estimating aid, not a design check, measured-work approval, quotation acceptance or invoice. Synthetic sample rates are fictional. Evidence is a locator, not an embedded file. Single editor; archive/restore and last20 session undos. Maximum1000 items; use controlled revisions for larger packages. No cloud connection or automatic browser storage.</p></article>';

 $('#dialog-title').textContent=id?'Edit takeoff '+id:'Add measured work';$('#form-error').textContent='';$('#fields').innerHTML=C.fields.map(k=>{let c;const v=r[k]??'';if(['method','costBasis','status'].includes(k)){const opts=k==='method'?[['manual','Manual measured quantity'],['length','Length'],['area','Area'],['volume','Volume'],['count','Count']]:k==='costBasis'?[['net','Net quantity'],['withAllowance','Net + explicit allowance']]:[['Draft','Draft'],['In Review','In Review'],['Reviewed','Reviewed'],['Superseded','Superseded']];c='<select name="'+k+'">'+opts.map(([a,b])=>'<option value="'+a+'" '+(a===v?'selected':'')+'>'+b+'</option>').join('')+'</select>';}else if(['note','source','description'].includes(k))c='<textarea name="'+k+'" rows="2">'+esc(v)+'</textarea>';else c='<input name="'+k+'" value="'+esc(v)+'" type="'+(numberFields.includes(k)?'number':k==='rateDate'?'date':'text')+'" '+(numberFields.includes(k)?'step="any" min="0" ':'')+(['id','boq','description','unit'].includes(k)?'required ':'')+(k==='id'&&id?'readonly':'')+'>';return '<label data-field="'+k+'">'+labels[k]+c+'</label>';}).join('');$('#fields [name="method"]').onchange=updateDimensions;updateDimensions();$('#item-dialog').showModal();}
