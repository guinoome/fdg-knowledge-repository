<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
  .bg{fill:#07111f}.panel{fill:#0f2137;stroke:#35516f;stroke-width:2}.panel2{fill:#102a46;stroke:#4a7196;stroke-width:2}
  .accent{fill:#1c8b76}.warn{fill:#a86b24}.stop{fill:#8a3340}.text{fill:#f4f7fb;font:600 22px system-ui,sans-serif}
  .small{fill:#c9d7e6;font:500 16px system-ui,sans-serif}.tiny{fill:#9fb2c7;font:500 13px system-ui,sans-serif}
  .title{fill:#ffffff;font:700 34px system-ui,sans-serif}.sub{fill:#9fc1db;font:500 17px system-ui,sans-serif}
  .line{stroke:#6f93b2;stroke-width:3;fill:none}.dash{stroke:#6f93b2;stroke-width:2;stroke-dasharray:8 8;fill:none}
</style>
<rect class="bg" width="1600" height="1000"/>
<text class="title" x="70" y="70">FDG First-Payout Commercial Validation — System Architecture</text>
<text class="sub" x="70" y="105">Existing intelligence systems remain authoritative; FPJIS coordinates the validation project.</text>
<rect class="panel2" x="590" y="140" rx="24" width="420" height="100"/><text class="text" x="675" y="182">FPJIS Validation Program</text><text class="small" x="657" y="214">Blueprints • Gates • Work Packages</text>
<rect class="panel" x="70" y="320" rx="20" width="250" height="120"/><text class="text" x="137" y="365">FBIS</text><text class="small" x="105" y="397">Pricing • Revenue</text><text class="small" x="92" y="420">Customer • Campaign</text>
<rect class="panel" x="365" y="320" rx="20" width="250" height="120"/><text class="text" x="425" y="365">FSvIS</text><text class="small" x="400" y="397">Service Definition</text><text class="small" x="414" y="420">Quality • Economics</text>
<rect class="panel" x="660" y="320" rx="20" width="250" height="120"/><text class="text" x="725" y="365">FMCIS</text><text class="small" x="693" y="397">Work Allocation</text><text class="small" x="697" y="420">Review • Handover</text>
<rect class="panel" x="955" y="320" rx="20" width="250" height="120"/><text class="text" x="1030" y="365">FAIS</text><text class="small" x="996" y="397">Audit • Evidence</text><text class="small" x="1000" y="420">Commercial Assurance</text>
<rect class="panel" x="1250" y="320" rx="20" width="250" height="120"/><text class="text" x="1310" y="365">FLIS / FSIS</text><text class="small" x="1282" y="397">Legal • Security</text><text class="small" x="1279" y="420">Professional Boundaries</text>
<rect class="panel2" x="210" y="575" rx="22" width="330" height="130"/><text class="text" x="300" y="622">FEIS + FBPOIS</text><text class="small" x="250" y="658">Engineering + Facility Semantics</text><text class="small" x="270" y="684">Maintenance • Construction</text>
<rect class="panel2" x="635" y="575" rx="22" width="330" height="130"/><text class="text" x="740" y="622">Local Workspace</text><text class="small" x="692" y="658">Offline Operational Records</text><text class="small" x="715" y="684">Backup • Restore • Evidence</text>
<rect class="panel2" x="1060" y="575" rx="22" width="330" height="130"/><text class="text" x="1164" y="622">FWAIS + FPIS</text><text class="small" x="1107" y="658">Automation / Productization</text><text class="small" x="1122" y="684">Only after paid evidence</text>
<rect class="panel" x="460" y="825" rx="22" width="680" height="100"/><text class="text" x="615" y="865">GitHub FDG Knowledge Repository</text><text class="small" x="550" y="897">Canonical blueprints, reusable knowledge, sanitized learning — not private client data</text>
<path class="line" d="M800 240V320"/><path class="line" d="M800 440V575"/><path class="line" d="M540 640H635"/><path class="line" d="M965 640H1060"/><path class="line" d="M800 705V825"/>
<path class="dash" d="M195 440C195 520 375 520 375 575"/><path class="dash" d="M490 440C490 500 800 500 800 575"/><path class="dash" d="M1080 440C1080 500 800 500 800 575"/><path class="dash" d="M1375 440C1375 530 1225 530 1225 575"/>
<text class="tiny" x="75" y="965">Rule: no system absorbs another system's authority. FPJIS orchestrates; domain systems remain canonical.</text>
</svg>