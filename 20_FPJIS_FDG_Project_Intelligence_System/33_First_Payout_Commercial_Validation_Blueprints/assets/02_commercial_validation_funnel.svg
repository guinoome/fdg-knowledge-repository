<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
  .bg{fill:#07111f}.panel{fill:#0f2137;stroke:#35516f;stroke-width:2}.panel2{fill:#102a46;stroke:#4a7196;stroke-width:2}
  .accent{fill:#1c8b76}.warn{fill:#a86b24}.stop{fill:#8a3340}.text{fill:#f4f7fb;font:600 22px system-ui,sans-serif}
  .small{fill:#c9d7e6;font:500 16px system-ui,sans-serif}.tiny{fill:#9fb2c7;font:500 13px system-ui,sans-serif}
  .title{fill:#ffffff;font:700 34px system-ui,sans-serif}.sub{fill:#9fc1db;font:500 17px system-ui,sans-serif}
  .line{stroke:#6f93b2;stroke-width:3;fill:none}.dash{stroke:#6f93b2;stroke-width:2;stroke-dasharray:8 8;fill:none}
</style>
<rect class="bg" width="1600" height="1000"/>
<text class="title" x="70" y="70">Commercial Validation Funnel — From Knowledge to First Payout</text>
<text class="sub" x="70" y="105">Do not jump from idea to SaaS. Each gate requires evidence.</text>
<g transform="translate(190,155)">
<path d="M0 0H1220L1090 105H130Z" fill="#12304f" stroke="#416789" stroke-width="2"/><text class="text" x="430" y="58">Existing FDG Knowledge + Market Signal</text>
<path d="M130 120H1090L990 225H230Z" fill="#123a55" stroke="#416789" stroke-width="2"/><text class="text" x="430" y="180">Specific Buyer + Pain</text>
<path d="M230 240H990L910 345H310Z" fill="#16465a" stroke="#416789" stroke-width="2"/><text class="text" x="448" y="300">Specific Offer</text>
<path d="M310 360H910L850 465H370Z" fill="#185968" stroke="#416789" stroke-width="2"/><text class="text" x="456" y="420">Verified Payment</text>
<path d="M370 480H850L800 585H420Z" fill="#176e70" stroke="#416789" stroke-width="2"/><text class="text" x="445" y="540">Delivered + Accepted</text>
<path d="M420 600H800L760 705H460Z" fill="#1c8b76" stroke="#416789" stroke-width="2"/><text class="text" x="495" y="660">Repeatable Economics</text>
<path d="M460 720H760L730 825H490Z" fill="#207a65" stroke="#416789" stroke-width="2"/><text class="text" x="510" y="780">Automation / Productization</text>
</g>
<rect class="stop" x="85" y="820" rx="18" width="330" height="90"/><text class="text" x="137" y="858">STOP CONDITIONS</text><text class="small" x="116" y="887">No demand • weak economics • high risk</text>
<rect class="accent" x="1185" y="820" rx="18" width="330" height="90"/><text class="text" x="1252" y="858">SCALE CONDITIONS</text><text class="small" x="1220" y="887">Repeated demand • stable workflow • margin</text>
<text class="tiny" x="70" y="965">Paid order proves willingness to pay for one tested combination of scope, price, buyer and channel — not scalability.</text>
</svg>