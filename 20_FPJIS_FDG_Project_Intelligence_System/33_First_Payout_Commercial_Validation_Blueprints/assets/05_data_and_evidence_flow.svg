<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
  .bg{fill:#07111f}.panel{fill:#0f2137;stroke:#35516f;stroke-width:2}.panel2{fill:#102a46;stroke:#4a7196;stroke-width:2}
  .accent{fill:#1c8b76}.warn{fill:#a86b24}.stop{fill:#8a3340}.text{fill:#f4f7fb;font:600 22px system-ui,sans-serif}
  .small{fill:#c9d7e6;font:500 16px system-ui,sans-serif}.tiny{fill:#9fb2c7;font:500 13px system-ui,sans-serif}
  .title{fill:#ffffff;font:700 34px system-ui,sans-serif}.sub{fill:#9fc1db;font:500 17px system-ui,sans-serif}
  .line{stroke:#6f93b2;stroke-width:3;fill:none}.dash{stroke:#6f93b2;stroke-width:2;stroke-dasharray:8 8;fill:none}
</style>
<rect class="bg" width="1600" height="1000"/>
<text class="title" x="70" y="70">Data + Evidence Flow — Capture Once, Reuse Everywhere</text>
<text class="sub" x="70" y="105">Authoritative records produce dashboards and reports; generated outputs do not overwrite source truth.</text>
<rect class="panel2" x="90" y="190" rx="20" width="300" height="120"/><text class="text" x="168" y="238">Capture</text><text class="small" x="120" y="274">Prospect • Signal • Evidence • Time</text>
<rect class="panel2" x="470" y="190" rx="20" width="300" height="120"/><text class="text" x="542" y="238">Validate</text><text class="small" x="506" y="274">Schema • Source • Authority</text>
<rect class="panel2" x="850" y="190" rx="20" width="300" height="120"/><text class="text" x="928" y="238">Store Local</text><text class="small" x="894" y="274">Revision • Audit • Conflict</text>
<rect class="panel2" x="1230" y="190" rx="20" width="280" height="120"/><text class="text" x="1288" y="238">Project Views</text><text class="small" x="1262" y="274">Dashboard • Report • Export</text>
<path class="line" d="M390 250H470M770 250H850M1150 250H1230"/>
<rect class="panel" x="175" y="470" rx="22" width="300" height="180"/><text class="text" x="235" y="520">Commercial Records</text><text class="small" x="220" y="558">Opportunity • Offer • Proposal</text><text class="small" x="235" y="588">Payment • Campaign</text><text class="small" x="250" y="618">Prospect • Interaction</text>
<rect class="panel" x="650" y="470" rx="22" width="300" height="180"/><text class="text" x="725" y="520">Delivery Records</text><text class="small" x="705" y="558">Pilot • Evidence • Inputs</text><text class="small" x="690" y="588">Time • Cost • Acceptance</text><text class="small" x="718" y="618">Issues • Feedback</text>
<rect class="panel" x="1125" y="470" rx="22" width="300" height="180"/><text class="text" x="1195" y="520">Learning Records</text><text class="small" x="1178" y="558">Market Signal • Decision</text><text class="small" x="1185" y="588">Lesson • Productization</text><text class="small" x="1180" y="618">Knowledge Return</text>
<path class="dash" d="M325 650C325 760 800 760 800 820M800 650V820M1275 650C1275 760 800 760 800 820"/>
<rect class="accent" x="560" y="815" rx="22" width="480" height="105"/><text class="text" x="665" y="855">Sanitized Knowledge Return</text><text class="small" x="620" y="890">GitHub repository — reusable only, no private client data</text>
</svg>