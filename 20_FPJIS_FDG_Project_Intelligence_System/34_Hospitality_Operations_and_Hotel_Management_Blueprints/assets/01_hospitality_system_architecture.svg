<rect class="p" x="405" y="330" rx="20" width="280" height="125"/><text class="t" x="485" y="378">FBPOIS / FEIS</text><text class="s" x="443" y="413">Engineering • Maintenance</text><text class="s" x="456" y="438">OOO/OOS • Evidence</text>
