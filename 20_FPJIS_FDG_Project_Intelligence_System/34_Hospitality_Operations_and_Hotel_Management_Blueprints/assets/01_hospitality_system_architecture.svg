<rect class="p" x="1055" y="330" rx="20" width="280" height="125"/><text class="t" x="1130" y="378">Distribution</text><text class="s" x="1096" y="413">Channel Adapter • OTA</text><text class="s" x="1105" y="438">Booking Engine • CRS</text>
<rect class="p" x="1380" y="330" rx="20" width="240" height="125"/><text class="t" x="1446" y="378">Platform</text><text class="s" x="1410" y="413">Identity • UX • Audit</text><text class="s" x="1400" y="438">Security • Integration</text>
<rect class="p2" x="250" y="610" rx="24" width="360" height="145"/><text class="t" x="330" y="658">Property Edge</text><text class="s" x="292" y="694">Local DB • LAN • Backup</text><text class="s" x="282" y="720">Front Desk • HK • F&B • Eng</text>
<rect class="p2" x="670" y="610" rx="24" width="360" height="145"/><text class="t" x="758" y="658">Operational Views</text><text class="s" x="710" y="694">Role-specific workspaces</text><text class="s" x="710" y="720">Attention Center • Reports</text>
