name: FMIS Issue 11 terminal-transition regression (review branch)
on:
  pull_request:
    paths:
      - '16_FDG_Building_Plant_Operations_Intelligence_System (FBPOIS)/02_FMIS/implementation/**'
      - '.github/workflows/fmis-issue11-terminal-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fmis-terminal-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real FMIS service with temporary SQLite databases
        run: python -m unittest discover -s '16_FDG_Building_Plant_Operations_Intelligence_System (FBPOIS)/02_FMIS/implementation/tests' -p 'test_fmis_core.py' -v
      - name: Test existing FMIS desktop UI on virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a /usr/bin/python3 -m unittest discover \
            -s '16_FDG_Building_Plant_Operations_Intelligence_System (FBPOIS)/02_FMIS/implementation/tests' \
            -p 'test_fmis_ui.py' -v
