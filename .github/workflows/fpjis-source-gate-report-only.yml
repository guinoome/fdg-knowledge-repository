name: FPJIS source-to-build scoped preflight
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run source-gate unit tests
        run: python -m unittest discover -s tools -p 'test_fpjis_*.py' -v
      - name: Run existing FMIS service core regression
        run: |
          python -m unittest discover \
            -s '16_FDG_Building_Plant_Operations_Intelligence_System (FBPOIS)/02_FMIS/implementation/tests' \
            -p 'test_fmis_core.py' -v
      - name: Run FMIS desktop UI regression under virtual display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          # Hosted toolcache Python can lack the tkinter extension; use the
          # distro interpreter paired with the installed python3-tk package.
          xvfb-run -a /usr/bin/python3 -m unittest discover \
            -s '16_FDG_Building_Plant_Operations_Intelligence_System (FBPOIS)/02_FMIS/implementation/tests' \
            -p 'test_fmis_ui.py' -v

      - name: Existing approved-status manifests (advisory structural scan)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Manual run: no PR base/head SHA; scan skipped."
            exit 0
          fi
          find Projects/Active -name fdg-fpjis-gate.json -print0 | while IFS= read -r -d '' manifest; do
            echo "Inspecting $manifest"
            python tools/fpjis_source_gate.py "$manifest" --base "$BASE_SHA" --head "$HEAD_SHA" || exit $?
          done
      - name: Enforce opted-in code scopes against reviewed baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Manual run: no PR; scoped enforcement cannot be inferred."
            exit 0
          fi
          python tools/fpjis_pr_preflight.py --base "$BASE_SHA" --head "$HEAD_SHA"
